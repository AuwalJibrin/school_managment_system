{% extends 'dashboard_base.html' %}

{% block title %}Delete Book | TEF FUN{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mt-3">Are you sure?</h3>
                <p class="text-muted">You are about to delete <strong>"{{ book.title }}"</strong>. This action cannot be
                    undone.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'admin-dashboard' %}" class="btn btn-light px-4">No, Keep it</a>
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
