{% extends 'dashboard_base.html' %}

{% block title %}Delete User | TEF FUN{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <i class="bi bi-person-x text-danger" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mt-3">Delete User?</h3>
                <p class="text-muted">Are you sure you want to delete user <strong>{{ user_to_delete.username
                        }}</strong>? All their data will be permanently removed.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'admin-dashboard' %}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
