{% extends 'accounts/auth_base.html' %}
{% block title %}Password Reset Complete | TEF FUN{% endblock %}

{% block content %}
<div class="auth-header">
    <div class="mb-3">
        <i class="bi bi-shield-check text-success" style="font-size: 3rem;"></i>
    </div>
    <h3 class="fw-bold mb-1">Password Reset!</h3>
    <p class="text-muted small">Your password has been set. You may go ahead and log in now.</p>
</div>

<div class="auth-body text-center">
    <a href="{% url 'signin' %}" class="btn btn-primary w-100 shadow-sm">Sign In</a>
</div>
{% endblock %}
