{% extends 'accounts/auth_base.html' %}
{% block title %}Reset Password | TEF FUN{% endblock %}

{% block content %}
<div class="auth-header">
    <h3 class="fw-bold mb-1">Reset Password</h3>
    <p class="text-muted small">Enter your email address to receive a password reset link</p>
</div>

<div class="auth-body">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 shadow-sm">Send Reset Link</button>
    </form>

    <div class="auth-footer">
        <p class="text-muted small mb-0">
            Remembered your password? <a href="{% url 'signin' %}"
                class="fw-bold text-decoration-none text-primary">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
